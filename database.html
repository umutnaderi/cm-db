<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Ultimate Database - Old-School-Football</title>
    <meta name="retroball-api-url" content="/local-api">
    <script>
      (() => {
        const backgrounds = [7, 8, 9];
        let previous = null;
        try {
          previous = sessionStorage.getItem("database-background");
        } catch {}
        const choices = backgrounds.filter((number) => String(number) !== previous);
        const selected = choices[Math.floor(Math.random() * choices.length)];
        try {
          sessionStorage.setItem("database-background", String(selected));
        } catch {}
        document.documentElement.style.setProperty(
          "--database-page-background",
          `url("img/0_${selected}.png")`,
        );
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260813-03">
  </head>
  <body class="database-page">
    <main class="shell">
      <header class="topbar database-topbar">
        <a class="database-banner-home" href="index.html" aria-label="Back to Old-School-Football home" title="Back to home"></a>
        <div class="database-tools">
          <label class="database-picker">
            <span>Season</span>
            <select id="databaseSelect" disabled>
              <option>Loading databases...</option>
            </select>
          </label>
          <div class="status" id="status">Loading databases...</div>
        </div>
      </header>

      <section class="controls" aria-label="Search filters">
        <label class="search-field">
          <span>Player search</span>
          <input id="nameSearch" type="search" placeholder="Zinedine Zidane" autocomplete="off" disabled>
        </label>
        <label>
          <span>Club</span>
          <div class="search-autocomplete">
            <input id="clubSearch" type="search" placeholder="Real Madrid" autocomplete="off" aria-autocomplete="list" aria-controls="clubSuggestions" aria-expanded="false" disabled>
            <div id="clubSuggestions" class="search-suggestions" role="listbox" hidden></div>
          </div>
        </label>
        <label>
          <span>League</span>
          <div class="search-autocomplete">
            <input id="leagueSearch" type="search" placeholder="Premier Division" autocomplete="off" aria-autocomplete="list" aria-controls="leagueSuggestions" aria-expanded="false" disabled>
            <div id="leagueSuggestions" class="search-suggestions" role="listbox" hidden></div>
          </div>
        </label>
        <label>
          <span>Nation</span>
          <div class="search-autocomplete">
            <input id="nationSearch" type="search" placeholder="Brazil" autocomplete="off" aria-autocomplete="list" aria-controls="nationSuggestions" aria-expanded="false" disabled>
            <div id="nationSuggestions" class="search-suggestions" role="listbox" hidden></div>
          </div>
        </label>
      </section>

      <section class="workspace">
        <aside class="results" aria-label="Search results">
          <div class="results-head">
            <div class="results-heading">
              <h2>Players</h2>
              <div id="activeSearchFilters" class="active-search-filters" aria-label="Active search conditions"></div>
            </div>
            <span id="resultCount">0 shown</span>
          </div>
          <div id="resultsList" class="results-list"></div>
        </aside>

        <article class="profile" id="profile">
          <div class="empty-state">No player selected.</div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <a class="support-button" href="https://ko-fi.com/eidolast" target="_blank" rel="noopener noreferrer">Support on Ko-fi</a>
    </footer>

    <script src="src/databaseSearch.js?v=20260809-04" type="module"></script>
  </body>
</html>
